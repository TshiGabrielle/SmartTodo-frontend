<h2>Tâches</h2>

<label>Contexte</label>

<select
  [(ngModel)]="selectedContextId"
  (change)="loadLists()">

  <option [value]="0">
    Choisir un contexte
  </option>

  <option *ngFor="let context of contexts"
          [value]="context.id">

    {{ context.nom }}

  </option>

</select>

<br><br>

<label>Liste</label>

<select
  [(ngModel)]="selectedListId"
  (change)="loadTasks()">

  <option [value]="0">
    Choisir une liste
  </option>

  <option *ngFor="let list of lists"
          [value]="list.id">

    {{ list.nom }}

  </option>

</select>

<br><br>

<ul>

  <li *ngFor="let task of tasks">

    {{ task.nom }}

    <button
      (click)="deleteTask(task.id)">

      Supprimer

    </button>

  </li>

</ul>
